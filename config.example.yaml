# 複製成 config.yaml 後再依你的手機/帳號調整。
# config.yaml 內含行事曆私密網址，已被 .gitignore 排除，不要 commit。

calendar:
  # Google 行事曆 → 設定 → 我的行事曆設定 → 選該行事曆 →
  # 「私密網址（iCal 格式）」，整串貼進來。
  ics_url: ""
  timezone: Asia/Taipei
  # 標題含到任一關鍵字就視為居家日，當天不訂餐。
  home_keywords: ["居家", "WFH", "在家上班", "Work From Home"]

line:
  package: jp.naver.line.android
  # 若你知道作燴官方帳號的深層連結（line://ti/p/@xxxx），填在這裡最穩，
  # 可完全跳過搜尋步驟。留空則走下面的搜尋流程。
  chat_deeplink: ""
  chat_search_keyword: "作燴"
  search_entry: ["搜尋", "search", "Search"]
  chat_title_match: ["作燴 ZoheyEats", "作燴"]
  # 聊天室底部切換圖文選單的那條列（截圖中的「訂購系統」）
  rich_menu_toggle: ["訂購系統"]

# 圖文選單是一張圖片，沒有文字節點可抓，只能用螢幕相對座標點擊。
# top/bottom 是選單區塊上下緣佔螢幕高度的比例，用 tools/calibrate.py 校正。
rich_menu:
  top: 0.608
  bottom: 0.927
  rows: 3
  cols: 4
  order_lunch: { row: 1, col: 1 }   # 左上角第一格「訂購午餐」

order:
  # 點開訂購午餐後會進入 eats.quickclick.cc 店家列表，用這些字樣確認有進到頁面
  store_page_markers: ["自取", "外送", "曾點過", "作燴"]
  # 注意店名用的是「臺」不是「台」，兩種都列出來以防改版
  store: ["作燴 - 臺北文創大樓", "臺北文創大樓", "台北文創大樓"]
  start_button: ["我要點餐"]
  category: ["健康特餐"]
  item_full: "12FIT - 特餐_七味蒜香雞胸(B)"
  item_match: ["12FIT - 特餐_七味蒜香雞胸(B)", "七味蒜香雞胸(B)", "七味蒜香雞胸"]
  search_box: ["搜尋全部商品"]
  search_term: "七味蒜香雞胸"
  # 加入購物車到結帳這段畫面依店家設定而異，設 optional 讓不存在的步驟自動略過。
  # 第一次執行請看 artifacts/ 內的截圖，再把實際按鈕文字補進來。
  checkout_steps:
    - name: 加入購物車
      match: ["加入購物車", "加入訂單", "確認加入"]
      optional: true
    - name: 前往購物車
      match: ["購物車", "查看購物車"]
      optional: true
    - name: 前往結帳
      match: ["前往結帳", "去結帳", "結帳"]
      optional: true
  payment: ["LINE Pay", "LINEPay", "Line Pay", "LinePay"]

guards:
  # 畫面出現任一字樣就中止，不再往下點（例如非訂餐時段、店家休息）
  unavailable_markers:
    - "暫不供應"
    - "暫不開放點餐"
    - "非訂餐時間"
    - "已額滿"
    - "本日已結單"

timing:
  app_launch: 6
  page_load: 4
  search: 3
