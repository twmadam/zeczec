name: Daily Accessories Scraper

on:
  schedule:
    # 每天早上 9:00 (UTC+8 台北時間) 執行
    # cron 格式為 UTC 時間，所以 01:00 UTC = 09:00 CST
    - cron: '0 1 * * *'
  workflow_dispatch: # 允許你手動點擊按鈕立即執行

jobs:
  scrape_and_mail:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 檢出程式碼
      uses: actions/checkout@v3

    - name: 🐍 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 📦 安裝必要套件
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: 🚀 執行爬蟲程式
      env:
        # 這裡從 GitHub Secrets 讀取敏感資訊
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: "adamsun@taiwanmobile.com"
      run: python scraper.py
